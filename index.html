<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <!-- Task 1 -->
        <div>
            <label>Ad</label>
            <input type="text" required>
        </div>

        <div>
            <label>Yaş</label>
            <input type="number" required min="18" max="99">
        </div>

        <div>
            <label> E-mail</label>
            <input type="email" required>
        </div>

        <!-- Task 2 --> 
         <div>
            <label>şifrə:</label>
            <input type="password" required>
        </div>
        <div>
            <label>yeni şifrə:</label>
            <input type="password" required pattern="(?=.*[a-z])(?=.*[A-Z]).{8,}">
            <title>Şifre en azi 8 simvoldan ibaret olmali ve icerisinde en azi bir boyuk herf olmalidir.</title>
        </div>
        <div>
            <label> yeni şifrənin təkrarı:</label>
            <input type="password" required>
        </div>
        <div> 
            <button type="submit">Tesdiq et</button>
        </div>

        <!-- task 3-->
         <div>
            <select>
                <optgroup label="Regionlar">
                    <option>Baki</option>
                    <option>Gence</option>
                    <option>Samaxi</option>
                    <option>Naxcivan</option>
                </optgroup>
            </select>
        </div>
        <div>
            <label>
                <input type="radio" checked name="odenis"> Nağd ödəniş
            </label>
            <label>
                <input type="radio" name="odenis"> Bank kartı ilə
            </label>
            <label>
                <input type="radio" name="odenis">Qapıda kartla
            </label>
        </div>

        <!--task 4-->
            <div>
            <label>
                <input type="checkbox">
                Frontend
            </label>
            <label>
                <input type="checkbox"> Backend
            </label>
            <label>
                <input type="checkbox"> UI/UX
            </label>
        </div>
        <div>
            <textarea rows="4" cols="50"></textarea>
        </div>

        <div>
            <label>
                <input type="checkbox" required> Qaydalar ve Sertler ile raziyam
            </label>
        </div>
<br>
        <div>
            <button type="submit"> Gonder</button>
        </div>


        <!--Task 5-->
           <div>
            <label>CV yukleyin:</label>
            <input type="file" accept=".pdf, .docx">
        </div>
        <div>
            <input type="tel" pattern="\+994[0-9]{9}" placeholder="Nomre qeyd edin" required>
        </div>
        <select>
            <optgroup label="vezifeler">
                <option>frontend</option>
                <option>backend</option>
                <option>uiux</option>
            </optgroup>
        </select> 
<br>
<br>

        <div>
            <button type="submit">muraciet gonder</button>
        </div>

        <!--Task 6-->
        <div>
            <label> Bilet sayi:</label>
            <input type="number" min="1" max="10" step="1">
        </div>

        <div>
            <label> Seans vaxtı</label>
            <input type="time">
            <input type="date" min="2026-10-20" required>
        </div>

        <div>
            <button type="submit">Bileti al</button>
        </div>

        <!-- task 7-->
         <fieldset>
            <legend>Şəxsi Məlumatlar:</legend>

            <div>
                <label for="fullname">Ad və Soyad</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Mesajınız:</legend>

            <div>
                <label for="email">E-poçt</label>
                <input type="email" id="email" name="email">
            </div>

            <div>
                <select>
                    <option>Texniki destek</option>
                    <option>Teklif ve irad</option>
                </select>
            </div>
            <div>
                <label for="message">Mesaj Gonderin :</label>
                <textarea id="message" name="message"></textarea>
            </div>
        </fieldset>
        <br>
        <br>
        <div>
            <button type="submit">Gonder</button>
        </div>

        <!--task 8-->
              <div>
            <label> budce araligi :</label>
            <input type="range" min="100" max="2000" step="50">
        </div>
        <div>
            <label>Avtomobil rengi :</label>
            <input type="color">
        </div>
        <br>
        <p>Yanacaq Novu:</p>
        <div>
            <label> Benzin :</label>
            <input type="radio">
        </div>
        <div>
            <label>Dizel :</label>
            <input type="radio">
        </div>
        <div>
            <label>Elektrik :</label>
            <input type="radio">
        </div>

        <!--Task 9-->
                <div>
            <input type="range" min="1" max="5">
        </div>

        <div>
            <label>təklif və şikayətlər :</label>
            <br>
            <textarea></textarea>
        </div>
        <div>
            <button type="reset">Temizle</button>
        </div>

        <!--task 10-->
         <div> 
        <input type="email" autocomplete="email" required> 
        <button type="submit">Abune ol</button>
       </div>
        
    </form>
</body>

</html>
